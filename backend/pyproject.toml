[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pareeksha"
version = "0.2.0"
description = "Pareeksha: voice-agent crash-test platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiokafka>=0.11",
    "httpx>=0.27",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "cryptography>=42",
    "numpy>=1.26",
    "pyyaml>=6",
    "rapidfuzz>=3.9",
    "scipy>=1.11",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "gnani-vachana>=0.8.2",
    "mypy>=1.10",
    "pytest>=8",
    "respx>=0.21",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "types-PyYAML",
]

# Third-party connectors register here (group "pareeksha.connectors"); built-ins are added by INT-01.
[project.entry-points."pareeksha.connectors"]
webhook = "pareeksha.integrations.webhook:WebhookConnector"
hubspot = "pareeksha.integrations.hubspot:HubSpotConnector"

[tool.setuptools.packages.find]
include = ["pareeksha*"]

[tool.setuptools.package-data]
"pareeksha.seed" = ["data/*.yaml"]
"pareeksha.llm" = ["prompts/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# RUF001-003: Indic-script and typographic characters are intentional test data and docstrings.
# B905: zip() strictness is not worth churn in code that predates the lint setup.
ignore = ["RUF001", "RUF002", "RUF003", "B905"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Generated from docs/schema.sql with sqlacodegen: long server_default / CHECK strings.
"pareeksha/db/models.py" = ["E501"]
# The rubric anchors are prompt text; wrapping them would change the prompt.
"pareeksha/evaluation/rubric.py" = ["E501"]

[tool.coverage.run]
source = ["pareeksha"]
concurrency = ["thread", "greenlet"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
files = ["pareeksha", "tests"]

# Third-party packages without type information.
[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*", "scipy", "scipy.*", "soundfile"]
ignore_missing_imports = true

# gnani-vachana ships no py.typed marker for gnani.tts (the other gnani modules are typed).
[[tool.mypy.overrides]]
module = ["gnani.tts"]
ignore_missing_imports = true

# EVAL-02 and VOICE-02 code and tests predate the mypy setup: they are checked
# (check_untyped_defs) but not yet required to carry full annotations. Tighten as those tasks
# touch them; new packages are strict.
[[tool.mypy.overrides]]
module = [
    "pareeksha.evaluation.*", "tests.evaluation.*",
    "pareeksha.audio.*", "tests.unit.audio.*", "tests.fixtures.*",
]
warn_return_any = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
