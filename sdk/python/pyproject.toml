[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pareeksha-sdk"
version = "0.2.0"
description = "Python SDK and CLI for the Pareeksha voice-agent crash-test platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.115",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "python-multipart>=0.0.9",
    "respx>=0.21",
    "ruff>=0.5",
    "types-PyYAML",
    "uvicorn>=0.30",
]

[project.scripts]
pareeksha = "pareeksha_sdk.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["pareeksha_sdk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
