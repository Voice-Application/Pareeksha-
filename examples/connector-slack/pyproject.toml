[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pareeksha-connector-slack"
version = "0.1.0"
description = "Example Pareeksha connector: post critical failures to a Slack incoming webhook"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

# The one line that makes Pareeksha discover the connector.
[project.entry-points."pareeksha.connectors"]
slack = "pareeksha_connector_slack:SlackConnector"

[tool.setuptools]
py-modules = ["pareeksha_connector_slack"]
