name: kafka-suite

# Real Kafka (KRaft) and Postgres from docker-compose.yml, no mocks of either:
#   backend/tests/kafka        QA-02: duplicates, SIGKILL crashes, retry -> DLQ, throttling,
#                              a real broker outage with the outbox draining in per-key order,
#                              two consumers sharing partitions
#   backend/tests/integration  INFRA-02 framework tests (including the real 30 s / 5 min delays)
on:
  push:
  pull_request:

jobs:
  kafka:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt

      - name: Start Kafka and Postgres
        run: |
          docker compose up -d kafka postgres
          docker compose up kafka-init
          docker compose ps

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r backend/requirements-dev.txt
          # Connectors are discovered through the pareeksha.connectors entry-point group,
          # which only exists once the package is installed (as it is in the Docker image).
          pip install --no-deps -e backend

      - name: Kafka suite
        run: scripts/ci/kafka_suite.sh

      - name: Broker and database logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail=300 kafka postgres

      - name: Stop the stack
        if: always()
        run: docker compose down -v
