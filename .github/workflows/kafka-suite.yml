name: kafka-suite

# Real Kafka (KRaft) and Postgres from docker-compose.yml, no mocks of either:
#   backend/tests/kafka        QA-02: duplicates, SIGKILL crashes, retry -> DLQ, throttling,
#                              a real broker outage with the outbox draining in per-key order,
#                              two consumers sharing partitions
#   backend/tests/integration  INFRA-02 framework tests (including the real 30 s / 5 min delays)
on:
  push:
    branches: [main]
    paths-ignore: ["*.md", "docs/guides/**", "docs/design/**", "docs/superpowers/**", "proof/**", "labelling/**"]
  pull_request:
    paths-ignore: ["*.md", "docs/guides/**", "docs/design/**", "docs/superpowers/**", "proof/**", "labelling/**"]
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"   # nightly full run, including the real retry delays

# Contract tests read docs/*.md and docs/schema.sql, so only docs nothing reads are ignored.
# A new push to a PR cancels the run it supersedes; main runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  kafka:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt

      - name: Start Kafka and Postgres
        run: |
          docker compose up -d kafka postgres
          docker compose up kafka-init
          docker compose ps

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r backend/requirements-dev.txt
          # Connectors are discovered through the pareeksha.connectors entry-point group,
          # which only exists once the package is installed (as it is in the Docker image).
          pip install --no-deps -e backend

      # test_real_delays waits the real 30 s + 5 min retry delays (about 5.5 min). The retry chain is
      # covered with short delays elsewhere, so PRs skip it; main, nightly and manual runs keep it.
      - name: Kafka suite
        run: scripts/ci/kafka_suite.sh ${{ github.event_name == 'pull_request' && '--deselect tests/integration/test_real_delays.py' || '' }}

      - name: Broker and database logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail=300 kafka postgres

      - name: Stop the stack
        if: always()
        run: docker compose down -v
