name: ci

# Lint, types and the tests that need no external service. Kafka-backed tests: kafka-suite.yml. Real-service
# acceptance (Gnani, DeepSeek, HubSpot) is `make verify`, run by a person with keys, never in this workflow.
on:
  push:
    branches: [main]
    paths-ignore: ["*.md", "docs/guides/**", "docs/design/**", "docs/superpowers/**", "proof/**", "labelling/**"]
  pull_request:
    paths-ignore: ["*.md", "docs/guides/**", "docs/design/**", "docs/superpowers/**", "proof/**", "labelling/**"]
  workflow_dispatch:

# Contract tests read docs/*.md and docs/schema.sql, so only docs nothing reads are ignored.
# A new push to a PR cancels the run it supersedes; main runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          pip install -r requirements.txt -r backend/requirements-dev.txt
          pip install --no-deps -e backend   # registers the pareeksha.connectors entry points
      - run: npm ci
        working-directory: web   # the contract test regenerates schema.d.ts with openapi-typescript
      - name: Lint
        working-directory: backend
        run: ruff check . && ruff format --check .
      - name: Types
        working-directory: backend
        run: mypy   # files = pareeksha, tests, ../mock_agent (pyproject.toml)
      - name: Unit, evaluation, judge and contract tests (no external services)
        working-directory: backend
        run: python -m pytest tests/unit tests/evaluation tests/judge tests/contract -q -p no:cacheprovider -n auto

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/app/**', 'web/components/**', 'web/lib/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-
      - run: npx playwright install --with-deps chromium
      - name: Page smoke and bundle scan (mocked API upstream, built app)
        run: npx playwright test --workers=4   # runners have 4 vCPUs; the default is half

  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -e "sdk/python[dev]" || pip install -e sdk/python pytest respx
      - run: python -m pytest sdk/python/tests -q -p no:cacheprovider

  build-fail-grep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: No stubs, TODOs or disabled checks outside tests/ and examples/
        run: |
          if git grep -nE 'STUB\(|TODO|FIXME|NotImplementedError|pass  # placeholder|pytest\.mark\.(skip|xfail)|eslint-disable|@ts-ignore|@ts-nocheck' \
              -- backend/pareeksha mock_agent sdk/python/src action web/app web/components web/lib ':!web/lib/api/schema.d.ts'; then
            echo "build-fail pattern found (GOAL.md)"; exit 1
          fi

  db:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pareeksha
          POSTGRES_PASSWORD: pareeksha
          POSTGRES_DB: pareeksha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pareeksha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pareeksha:pareeksha@localhost:5432/pareeksha
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt
      - run: |
          pip install -r requirements.txt -r backend/requirements-dev.txt
          pip install --no-deps -e backend
      - name: Migrations, constraints and Postgres-only end-to-end tests
        working-directory: backend
        run: python -m pytest tests/db tests/e2e -q -p no:cacheprovider
